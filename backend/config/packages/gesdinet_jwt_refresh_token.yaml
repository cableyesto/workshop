gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken

    # Refresh token TTL (30 days)
    ttl: 2592000

    # Single use tokens (rotates on each refresh)
    single_use: true

    # Token parameter name
    token_parameter_name: refresh_token

    # HttpOnly cookie configuration
    cookie:
        enabled: true
        same_site: lax
        path: /
        domain: null
        http_only: true      # Protected from JavaScript (XSS protection)
        secure: false        # Set to true in production (HTTPS only)
        remove_token_from_body: false  # Keep token in JSON response too
