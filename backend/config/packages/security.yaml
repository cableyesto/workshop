security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\Owner: 'auto'
        App\Entity\Receptionist: 'auto'
        # Mechanic PIN is hashed manually in setPin() method

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Combined provider for EVERYTHING protected by JWT
        all_users:
            chain:
                providers: ['owner_provider', 'receptionist_provider', 'mechanic_provider']

        # Chain provider for email/password authentication (Owner + Receptionist)
        email_users:
            chain:
                providers: ['owner_provider', 'receptionist_provider']

        owner_provider:
            entity:
                class: App\Entity\Owner
                property: email

        receptionist_provider:
            entity:
                class: App\Entity\Receptionist
                property: email

        # Separate provider for mechanics (PIN authentication)
        mechanic_provider:
            entity:
                class: App\Entity\Mechanic
                property: id

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Protected API routes (require JWT authentication)
        api:
            pattern: ^/api
            stateless: true
            provider: all_users
            jwt: ~
            logout:
                path: /api/logout
#        main:
#            custom_authenticators:
#                - App\Security\MechanicPinAuthenticator

    # Role hierarchy (optional)
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_OWNER: ROLE_USER
        ROLE_RECEPTIONIST: ROLE_USER
        ROLE_MECHANIC: ROLE_USER

    # Access control rules
    access_control:
        # Public endpoints
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/garage/[^/]+/mechanic/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }

        # Protected API endpoints (require JWT authentication)
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # Role-based access (examples - uncomment and customize as needed)
        # - { path: ^/api/owner, roles: ROLE_OWNER }
        # - { path: ^/api/receptionist, roles: ROLE_RECEPTIONIST }
        # - { path: ^/api/mechanic, roles: ROLE_MECHANIC }

when@test:
    security:
        password_hashers:
            # Reduce cost in tests for better performance
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

when@prod:
    security:
        access_control:
            # Public endpoints
            - { path: ^/api/login$, roles: PUBLIC_ACCESS }
            - { path: ^/api/garage/[^/]+/mechanic/login$, roles: PUBLIC_ACCESS }
            - { path: ^/api/token/refresh$, roles: PUBLIC_ACCESS }
            - { path: ^/api/health, roles: PUBLIC_ACCESS, ips: [127.0.0.1, '::1'] }  # Production: localhost only

            # Protected API endpoints (require JWT authentication)
            - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
